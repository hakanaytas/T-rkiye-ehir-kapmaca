<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Canlı Türkiye Haritası — Sosyal Oyun</title>
<meta name="description" content="81 ili seç, ekibini kur, sohbet et, emoji at, komşu illere eğlenceli saldırılar düzenle. Canlı, sosyal Türkiye haritası oyunu." />
<meta name="theme-color" content="#0B1120" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ Takma ad / giriş ekranı ============ -->
<div id="onboard" class="onboard">
  <div class="onboard-card">
    <div class="onboard-crest">🗺️</div>
    <h1>Canlı Türkiye Haritası</h1>
    <p class="onboard-sub">81 il, tek harita, sonsuz eğlence. Bir il seç, ekibine katıl, sohbet et, saldır!</p>
    <label class="onboard-label" for="nickname-input">Rumuzun</label>
    <input id="nickname-input" class="onboard-input" type="text" maxlength="16" placeholder="ör. Hakan34" autocomplete="off" />
    <button id="onboard-start" class="btn btn-primary btn-block">Haritaya Gir 🚀</button>
    <p class="onboard-note">Rumuzun herkese açık görünür. Kişisel bilgi paylaşma.</p>
  </div>
</div>

<!-- ============ Üst bar ============ -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-logo">🗺️</span>
    <span class="topbar-title">Türkiye<strong>Canlı</strong></span>
  </div>
  <div class="topbar-stats">
    <span class="pill" id="stat-online" title="Aktif oyuncu">👤 <b>0</b></span>
    <span class="pill" id="stat-captured" title="Ele geçirilmiş il">🔥 <b>0</b>/81</span>
  </div>
  <button id="me-btn" class="me-chip" title="Profilim">
    <span id="me-dot" class="me-dot"></span>
    <span id="me-name">—</span>
  </button>
</header>

<!-- ============ Harita ============ -->
<main class="map-wrap">
  <svg id="map-svg" aria-label="Türkiye haritası"></svg>
  <div id="map-loading" class="map-loading">Harita yükleniyor…</div>

  <!-- Uçan saldırı / emoji efektleri bu katmana eklenir -->
  <div id="fx-layer" class="fx-layer"></div>

  <!-- İl üstü geçici etiketler (ör. "HAKAN'IN EKİBİ") -->
  <div id="label-layer" class="label-layer"></div>

  <div class="map-hint" id="map-hint">Bir il seçmek için haritaya dokun</div>
</main>

<!-- ============ Bildirimler ============ -->
<div id="toast-container" class="toast-container"></div>
<div id="banner-container" class="banner-container"></div>

<!-- ============ Alt panel: seçili il ============ -->
<section id="province-sheet" class="sheet province-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-eyebrow" id="p-status">SEÇİLİ İL</div>
      <h2 id="p-name">—</h2>
      <div class="sheet-meta" id="p-meta"></div>
    </div>
    <button class="icon-btn" id="p-close" aria-label="Kapat">✕</button>
  </div>

  <div class="sheet-actions">
    <button id="p-join-btn" class="btn btn-teal btn-block">Bu İle Katıl</button>
    <button id="p-attack-btn" class="btn btn-red btn-block" disabled>Saldır ⚔️</button>
  </div>

  <button id="p-chat-toggle" class="btn btn-ghost btn-block">💬 İl Sohbetini Aç</button>
</section>

<!-- ============ Sohbet paneli ============ -->
<section id="chat-sheet" class="sheet chat-sheet">
  <div class="sheet-handle" id="chat-drag-handle"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-eyebrow">SOHBET</div>
      <h2 id="chat-title">—</h2>
    </div>
    <button class="icon-btn" id="chat-close" aria-label="Kapat">✕</button>
  </div>

  <div id="chat-messages" class="chat-messages"></div>

  <div class="emoji-bar" id="emoji-bar"></div>

  <form id="chat-form" class="chat-form">
    <input id="chat-input" class="chat-input" type="text" maxlength="300" placeholder="Bir şeyler yaz…" autocomplete="off" />
    <button type="submit" class="chat-send" aria-label="Gönder">➤</button>
  </form>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
